name: Generate snake animation

on:
  schedule: # executa uma vez por dia
    - cron: "0 */12 * * *"

  workflow_dispatch:

  push:
    branches:
    - main

jobs:
  generate:
    permissions:
      contents: write
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: generate snake.svg
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: LuizEduardoMarchi
          outputs: |
            dist/snake.svg?color_snake=#f5c518&color_dots=#24283b,#5c3a2e,#a3492a,#d9532f,#ff6e3c

      - name: push snake.svg to the output branch
        uses: crazy-max/ghaction-github-pages@v3.1.0
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
